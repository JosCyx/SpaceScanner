name: SpaceScanner CI / Release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===============================================================
  # FASE 1: QUALITY GATES (Se ejecutan en paralelo al inicio)
  # ===============================================================
  unit-tests:
    name: 🧪 Pruebas Unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar librerías gráficas para pruebas
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev

      - name: Ejecutar pruebas unitarias (8 tests)
        working-directory: ./rust
        run: cargo test --verbose

  code-quality:
    name: 🔍 Calidad y Análisis Estático (Clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Rust con Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Instalar librerías gráficas
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev

      - name: Ejecutar análisis estático (Linter)
        working-directory: ./rust
        run: cargo clippy -- -D warnings

  # ===============================================================
  # FASE 2: COMPILACIÓN Y PUBLICACIÓN DIFERIDA POR SISTEMA OPERATIVO
  # (Cada SO publica de inmediato en cuanto termina de compilar)
  # ===============================================================
  build-windows:
    name: 🪟 Windows (Rust .exe + C# Legacy)
    needs: [unit-tests, code-quality]
    runs-on: windows-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configurar MSBuild (.NET)
        uses: microsoft/setup-msbuild@v2

      # Compilar versión clásica C# WinForms
      - name: Compilar C# WinForms Legacy
        run: msbuild csharp/SpaceScanner.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Empaquetar C# Legacy en ZIP
        run: |
          Compress-Archive -Path csharp/SpaceScanner/bin/Release/* -DestinationPath SpaceScanner-v1.0.0-csharp-legacy.zip

      # Compilar versión moderna Rust
      - name: Compilar Rust Release
        working-directory: ./rust
        run: cargo build --release

      - name: Preparar ejecutable de Rust
        run: copy rust\target\release\spacescanner.exe SpaceScanner-windows-x64.exe

      - name: Guardar artefactos en Actions
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            SpaceScanner-windows-x64.exe
            SpaceScanner-v1.0.0-csharp-legacy.zip

      # Publicar / Agregar directamente al Release si es un Tag
      - name: Publicar / Agregar binarios de Windows al Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SpaceScanner-windows-x64.exe
            SpaceScanner-v1.0.0-csharp-legacy.zip
          generate_release_notes: true

  build-linux:
    name: 🐧 Linux (Portable + .deb)
    needs: [unit-tests, code-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del sistema y cargo-deb
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev
          cargo install cargo-deb

      - name: Compilar Rust Release
        working-directory: ./rust
        run: cargo build --release

      - name: Empaquetar ejecutable portátil (.tar.gz)
        run: |
          tar -czvf SpaceScanner-linux-x64.tar.gz -C rust/target/release spacescanner

      - name: Generar paquete instalador .deb
        working-directory: ./rust
        run: cargo deb --no-build

      - name: Mover instalador .deb
        run: cp rust/target/debian/*.deb ./SpaceScanner-linux-amd64.deb

      - name: Guardar artefactos en Actions
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            SpaceScanner-linux-x64.tar.gz
            SpaceScanner-linux-amd64.deb

      # Publicar / Agregar directamente al Release si es un Tag
      - name: Publicar / Agregar binarios de Linux al Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SpaceScanner-linux-x64.tar.gz
            SpaceScanner-linux-amd64.deb
          generate_release_notes: true

  build-macos:
    name: 🍏 macOS (Portable)
    needs: [unit-tests, code-quality]
    runs-on: macos-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Rust Release
        working-directory: ./rust
        run: cargo build --release

      - name: Empaquetar ejecutable macOS (.tar.gz)
        run: |
          tar -czvf SpaceScanner-macos-x64.tar.gz -C rust/target/release spacescanner

      - name: Guardar artefactos en Actions
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: SpaceScanner-macos-x64.tar.gz

      # Publicar / Agregar directamente al Release si es un Tag
      - name: Publicar / Agregar binarios de macOS al Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpaceScanner-macos-x64.tar.gz
          generate_release_notes: true
